appId: "com.rocklumajang.app"
productName: "RockLumajang"
directories:
  output: "release"
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
win:
  target: "nsis"
  icon: "build/icon.ico"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
