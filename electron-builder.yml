appId: "com.rocklumajang.app.v2"
productName: "RockLumajang V2"
directories:
  output: "release"
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
win:
  target: "nsis"
  icon: "build/icon.ico"
  artifactName: "RockLumajang-V2-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "RockLumajang V2"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
